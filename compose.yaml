services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scrap_street
      POSTGRES_USER: scrap
      POSTGRES_PASSWORD: scrap_dev
    ports:
      - "5432:5432"
    volumes:
      - scrap_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrap -d scrap_street"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: src/Game.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Game: Host=postgres;Port=5432;Database=scrap_street;Username=scrap;Password=scrap_dev
      Jwt__Issuer: scrap-street-dev
      Jwt__Audience: scrap-street-client
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY to a random secret of at least 32 bytes}
      Client__Origin: http://localhost:5173
      DataProtection__KeysPath: /app/keys
    ports:
      - "5080:8080"
    volumes:
      - scrap_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  scrap_postgres:
  scrap_keys:
